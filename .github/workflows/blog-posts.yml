name: Latest blog posts

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://tqhuyen.substack.com/feed"
          max_post_count: 5
          template: "- [$title]($url) <sub>· $date</sub>$newline"
          date_format: "mmm d, yyyy"
          commit_message: "docs: refresh latest blog posts"
